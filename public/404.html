<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>404 — 파일을 찾을 수 없습니다</title>
  </head>
  <body>
    <!--
      정적 파일(해시 자산)이 없을 때만 쓰이는 최소 404 문서다.
      앱의 404 화면은 클라이언트 라우팅(NotFoundPage)이 담당하므로 여기서 꾸미지 않는다.
      이 문서의 존재 이유는 _redirects 에서 /assets/* 를 404 로 떨구기 위함이다 —
      자세한 사정은 public/_redirects 주석 참고.
    -->
    <p>파일을 찾을 수 없습니다.</p>
  </body>
</html>
