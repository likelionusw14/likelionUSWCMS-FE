components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 내부 userId를 sub로 가진 짧은 만료의 서비스 Access JWT
    onboardingSession:
      type: apiKey
      in: cookie
      name: onboarding_session
      description: 검증된 카카오 로그인 후 추가 정보 입력에만 사용하는 짧은 만료의 HttpOnly 쿠키
    refreshSession:
      type: apiKey
      in: cookie
      name: refresh_session
      description: 서버 저장·회전·폐기되는 Refresh Token의 HttpOnly 쿠키
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 쿠키 인증 상태 변경 요청에 필요한 CSRF 토큰

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 동일 사용자·엔드포인트에서 24시간 동안 같은 요청 결과를 재사용하는 UUID 키
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AttendanceId:
      name: attendanceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CertificateId:
      name: certificateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }

  headers:
    RequestId:
      description: 요청 추적 식별자
      schema: { type: string }
    RetryAfter:
      description: 재시도까지 기다릴 초
      schema: { type: integer, minimum: 1 }

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED]
    SystemRole:
      type: string
      enum: [MEMBER, ADMIN]
    PartType:
      type: string
      enum: [PLANNING, DESIGN, FRONTEND, BACKEND, COMMON]
    AttendanceStatus:
      type: string
      enum: [NOT_CHECKED, PRESENT, LATE, ABSENT]
    CheckInSource:
      type: string
      enum: [SELF_CODE, ADMIN]
    NoticeTag:
      type: string
      enum: [SCHEDULE, PROJECT, PROMOTION_EVENT, OTHER]
    ProjectType:
      type: string
      enum: [HACKATHON, IDEATHON]
      description: 프로젝트 유형 태그. HACKATHON은 해커톤, IDEATHON은 아이디어톤입니다.
