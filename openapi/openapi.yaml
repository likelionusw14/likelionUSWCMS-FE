  responses:
    BadRequest:
      description: 잘못된 요청
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: 인증 실패 또는 세션 만료
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 계정 상태 또는 역할로 인해 접근 불가
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 대상이 없거나 공개할 수 없음
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 중복, 잘못된 상태 전이 또는 version 충돌
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: 파일 크기 제한 초과
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: 지원하지 않는 파일 MIME 유형
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: 입력값 검증 실패
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: 요청 제한 초과
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: 카카오 또는 외부 저장소 연동 실패
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalServerError:
      description: 내부 오류. 스택·DB·호스트 정보를 노출하지 않음
      headers:
        X-Request-ID: { $ref: '#/components/headers/RequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }