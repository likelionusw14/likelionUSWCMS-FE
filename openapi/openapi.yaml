openapi: 3.1.0
info:
  title: CMS API
  version: 1.0.0
  license:
    name: License not specified
    identifier: LicenseRef-Unspecified
  description: |
    수원대학교 멋쟁이사자처럼 CMS 1차 MVP의 최종 API 계약입니다.

    - 기본 경로: `/api`
    - 인증: 카카오 Authorization Code + OIDC 검증 후 서비스 JWT 발급
    - 역할: `MEMBER`, `ADMIN`
    - 계정 상태: `PENDING`, `ACTIVE`, `REJECTED`
    - JSON 필드: lowerCamelCase
    - 오류: RFC 9457 Problem Details (`application/problem+json`)
    - 목록 페이지: 0부터 시작하는 `page`, 기본 20, 최대 100
    - 모든 오류 응답에 `X-Request-ID`를 반환합니다.

    `ADMIN` 전용 작업은 `x-required-roles`, ACTIVE 계정 전용 작업은
    `x-required-account-status` 확장 필드로 표시합니다.
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/suwon-0a7/CMS-API/1.0.0
  - url: /api
    description: 현재 호스트의 API
tags:
  - name: Auth
    description: 카카오 OIDC 로그인과 서비스 토큰·세션 관리
  - name: Accounts
    description: 본인 계정 생성
  - name: AdminAccounts
    description: 관리자 회원 승인·거절·수정·역할 관리
  - name: Cohorts
    description: 기수 선택지 조회
  - name: Projects
    description: 프로젝트 목록·태그별·상세 조회
  - name: AdminProjects
    description: 관리자 프로젝트 등록·수정·삭제
  - name: Files
    description: Private S3 파일 업로드 URL 발급과 완료 검증
  - name: Resources
    description: 세션 자료 목록·상세·파일 조회
  - name: AdminResources
    description: 관리자 세션 자료 등록·수정
  - name: Notices
    description: 공지 목록·상세 조회
  - name: AdminNotices
    description: 관리자 공지 등록·수정
  - name: Lions
    description: ACTIVE AppUser 기반 사자 목록 조회
  - name: Schedules
    description: 월별 일정·상세 조회
  - name: AdminSchedules
    description: 관리자 일정 등록·수정·삭제
  - name: Attendances
    description: 본인 출결 조회와 코드 인증
  - name: AdminAttendances
    description: 관리자 출결 세션·상태 관리
  - name: Certificates
    description: 활동증명서 정보 확인·발급·다운로드
  - name: Health
    description: 애플리케이션 생존·준비 상태 확인
security:
  - bearerAuth: []

paths:
  /auth/kakao/login:
    get:
      tags: [Auth]
      operationId: startKakaoLogin
      summary: 카카오 로그인 시작
      description: 서버가 state와 nonce를 생성해 임시 저장하고 카카오 인증 화면으로 이동합니다.
      security: []
      responses:
        '302':
          description: 카카오 인증 화면으로 이동
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /auth/kakao/callback:
    get:
      tags: [Auth]
      operationId: handleKakaoCallback
      summary: 카카오 OIDC 콜백 처리
      description: |
        Authorization Code를 교환하고 ID Token의 서명, iss, aud, exp, nonce, sub를 검증합니다.
        미가입자는 짧은 만료의 `onboarding_session` HttpOnly 쿠키를, 기존 계정은
        회전 가능한 `refresh_session` HttpOnly 쿠키를 설정한 뒤 프론트로 이동합니다.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 16 }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: 인증 결과 화면으로 이동
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
            Set-Cookie:
              description: Secure, HttpOnly, SameSite=Lax 쿠키
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /auth/tokens:
    post:
      tags: [Auth]
      operationId: reissueAccessToken
      summary: 서비스 Access Token 재발급
      description: Refresh Token을 회전하고 짧은 만료의 Access JWT를 반환합니다.
      security:
        - refreshSession: []
          csrfToken: []
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/session:
    delete:
      tags: [Auth]
      operationId: logout
      summary: 서비스 로그아웃
      description: 서버 저장소의 Refresh Token을 폐기하고 쿠키를 만료시킵니다. 카카오 연결 해제는 수행하지 않습니다.
      security:
        - refreshSession: []
          csrfToken: []
      responses:
        '204': { description: 로그아웃 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: 최초 추가 정보 입력 및 가입 신청
      description: |
        검증된 카카오 onboarding 세션에 추가 정보를 결합하여 PENDING 계정을 생성합니다.
        추가 정보 입력 전에 이탈하면 AppUser를 생성하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - onboardingSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: PENDING 계정 생성
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/accounts:
    get:
      tags: [AdminAccounts]
      operationId: listAccounts
      summary: 회원 목록 조회
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/SystemRole' }
        - name: cohortId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: part
          in: query
          schema: { $ref: '#/components/schemas/PartType' }
        - name: keyword
          in: query
          description: 이름 또는 학번 검색
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: 가입 신청일 내림차순 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/accounts/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [AdminAccounts]
      operationId: getAccountById
      summary: 회원 상세 조회
      x-required-roles: [ADMIN]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AdminAccounts]
      operationId: updateAccount
      summary: 회원 정보 수정
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [AdminAccounts]
      operationId: deleteAccount
      summary: 회원 삭제
      description: Soft delete합니다. 마지막 ADMIN은 삭제할 수 없습니다.
      x-required-roles: [ADMIN]
      responses:
        '204': { description: 삭제 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/accounts/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [AdminAccounts]
      operationId: updateAccountStatus
      summary: 가입 승인 또는 거절
      description: PENDING 계정을 ACTIVE 또는 REJECTED로 변경하고 처리자·시각·사유를 감사 로그에 남깁니다.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountStatusRequest' }
      responses:
        '200':
          description: 상태 변경 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/accounts/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [AdminAccounts]
      operationId: updateAccountRole
      summary: 회원 역할 변경
      description: ACTIVE 회원만 변경할 수 있으며 마지막 ADMIN의 MEMBER 변경은 차단합니다.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: 역할 변경 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /cohorts:
    get:
      tags: [Cohorts]
      operationId: listCohorts
      summary: 기수 선택지 조회
      description: 프로젝트의 기수 태그 선택에 사용할 전체 기수를 기수 번호 내림차순으로 반환합니다.
      x-required-account-status: [ACTIVE]
      responses:
        '200':
          description: 기수 번호 내림차순 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CohortListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: 프로젝트 목록 및 태그별 조회
      description: |
        기수, 해커톤, 아이디어톤 필터는 각각 독립적으로 선택할 수 있습니다.
        `cohortId`와 `projectTypes`를 함께 전달하면 `cohortId AND projectType IN (projectTypes)`로 조회합니다.
        예를 들어 기수·해커톤·아이디어톤을 모두 선택하면 해당 기수의 해커톤 또는 아이디어톤 프로젝트를 반환합니다.
      x-required-account-status: [ACTIVE]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: cohortId
          in: query
          description: 기수 태그 ID
          schema: { $ref: '#/components/schemas/Id' }
        - name: projectTypes
          in: query
          description: 프로젝트 유형 필터. 해커톤과 아이디어톤을 하나 또는 모두 선택할 수 있습니다.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 2
            uniqueItems: true
            items: { $ref: '#/components/schemas/ProjectType' }
      responses:
        '200':
          description: 등록일 내림차순 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: 프로젝트 상세 조회
      x-required-account-status: [ACTIVE]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/projects:
    post:
      tags: [AdminProjects]
      operationId: createProject
      summary: 프로젝트 등록
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: 등록 성공
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    patch:
      tags: [AdminProjects]
      operationId: updateProject
      summary: 프로젝트 수정
      description: thumbnailAssetId 미전달은 유지, null은 이미지 제거입니다.
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [AdminProjects]
      operationId: deleteProject
      summary: 프로젝트 삭제
      x-required-roles: [ADMIN]
      responses:
        '204': { description: 삭제 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/file-upload-urls:
    post:
      tags: [Files]
      operationId: createFileUploadUrl
      summary: 파일 업로드 URL 발급
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileUploadUrlRequest' }
      responses:
        '201':
          description: Presigned PUT URL 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileUploadUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/files:
    post:
      tags: [Files]
      operationId: completeFileUpload
      summary: 업로드 완료 검증 및 파일 자산 등록
      description: 발급 기록과 S3 HEAD의 객체 키·MIME·크기·체크섬을 검증한 뒤 FileAsset을 생성합니다.
      x-required-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileAssetRequest' }
      responses:
        '201':
          description: 파일 자산 등록 성공
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileAssetResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: 세션 자료 목록 조회
      x-required-account-status: [ACTIVE]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: week
          in: query
          schema: { type: integer, minimum: 1, maximum: 52 }
        - name: targetPart
          in: query
          schema: { $ref: '#/components/schemas/PartType' }
      responses:
        '200':
          description: 등록일 내림차순 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourcePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /resources/{resourceId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      operationId: getResource
      summary: 세션 자료 상세 조회
      x-required-account-status: [ACTIVE]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningResourceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /resources/{resourceId}/download-url:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      operationId: getResourceDownloadUrl
      summary: 자료 미리보기·다운로드 URL 발급
      x-required-account-status: [ACTIVE]
      responses:
        '200':
          description: 짧은 만료의 Private S3 Presigned URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
